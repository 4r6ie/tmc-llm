base_model: TinyLlama/TinyLlama-1.1B-Chat-v1.0
dataset_train: data/processed/train.jsonl
dataset_validation: data/processed/validation.jsonl
output_dir: models/adapters/tmc-lm-tinyllama-lora

max_seq_length: 768
num_train_epochs: 5
max_steps: 80
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.0002
warmup_steps: 5
logging_steps: 5
save_steps: 20
eval_steps: 20

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

