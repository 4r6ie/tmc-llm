base_model: TinyLlama/TinyLlama-1.1B-Chat-v1.0
dataset_train: data/processed/train.jsonl
dataset_validation: data/processed/validation.jsonl
output_dir: models/adapters/tmc-lm-tinyllama-lora

version: "1.0"

max_seq_length: 768
num_train_epochs: 5
max_steps: 300
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 0.0002
warmup_steps: 10
logging_steps: 10
save_steps: 50
eval_steps: 50

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

