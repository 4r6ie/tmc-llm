base_model: TinyLlama/TinyLlama-1.1B-Chat-v1.0
dataset_train: data/processed/qa_train.jsonl
dataset_validation: data/processed/qa_validation.jsonl
output_dir: models/adapters/tmc-lm-tinyllama-lora-qa

version: "1.0-qa"

# QA answers are short; 768 is more than enough
max_seq_length: 768
# 119 train QA pairs, batch 1 x accum 4 = ~30 optimizer steps/epoch -> 10 epochs = ~300 steps (T4 ~25-40 min)
num_train_epochs: 10
max_steps: -1
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 0.0002
warmup_steps: 10
logging_steps: 10
save_steps: 50
eval_steps: 50
# Keep the checkpoint with the lowest validation loss, not just the last one
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
lr_scheduler_type: cosine
weight_decay: 0.01

# Colab T4 GPU: use fp16 (bf16 not supported on T4)
bf16: false
fp16: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj