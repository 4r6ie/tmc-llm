[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tmc-llm"
version = "0.1.0"
description = "TinyLlama LoRA training scaffold for Trinidad Municipal College knowledge."
license = {text = "Apache-2.0"}
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate>=0.33.0",
    "datasets>=2.20.0",
    "peft>=0.12.0",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "pyyaml>=6.0.1",
    "sentencepiece>=0.2.0",
    "torch>=2.3.0,<3",
    "transformers>=4.43.0,<6",
    "openpyxl>=3.1.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.27.0",
]

[project.optional-dependencies]
# GGUF inference via llama-cpp-python (python -m tmc_llm.cli / -m tmc_llm.api).
# Kept out of core dependencies so CI and containers that talk to llama.cpp
# binaries directly do not need to build it.
local = [
    "llama-cpp-python>=0.2.60",
]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=2.0,<3",
    "pre-commit>=3.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",
    "RUF",
]
ignore = [
    "B008", # function calls in default argument
]

[tool.ruff.lint.per-file-ignores]
# Long lines are intentional literal dataset content (not code).
"src/tmc_llm/dataset_builder.py" = ["E501"]
# Mojibake replacement keys intentionally contain ambiguous unicode.
"src/tmc_llm/text_cleaning.py" = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["tmc_llm"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
plugins = []
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "peft.*", "datasets.*", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

